spring:
  jpa:
    show-sql: false

app:
  cors:
    # Cho phép chạy thử từ máy khác trong mạng nội bộ; production phải đặt CORS_ALLOWED_ORIGINS riêng.
    allowed-origins: http://localhost:[*],http://127.0.0.1:[*],http://10.*:[*],http://172.*:[*],http://192.168.*:[*]

logging:
  level:
    com.ltmtu.ielts: DEBUG
    org.flywaydb: INFO
