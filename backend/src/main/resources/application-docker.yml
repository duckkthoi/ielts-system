# Chạy trong docker compose: các host là tên service.
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:ielts}
  mail:
    host: ${MAIL_HOST:mailpit}

app:
  upload-dir: ${UPLOAD_DIR:/data/uploads}

server:
  # Sau nginx: lấy IP client và giao thức gốc từ X-Forwarded-* (nhật ký, giới hạn đăng nhập sai).
  # Chỉ bật ở profile docker, nơi backend không lộ cổng HTTP ra ngoài nên client không giả được header này.
  forward-headers-strategy: framework
