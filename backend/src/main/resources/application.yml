spring:
  application:
    name: ielts
  profiles:
    default: dev
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:Ielts}
    username: ${DB_USER:ielts}
    password: ${DB_PASSWORD:ielts}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      # Không đặt 2 giá trị này thì JavaMail gọi InetAddress.getLocalHost() (tạo Message-ID, lệnh EHLO);
      # trên Windows lần tra DNS tên máy đó có thể mất ~5 giây cho mỗi email.
      mail.smtp.localhost: ${MAIL_SMTP_LOCALHOST:localhost}
      mail.from: ${MAIL_FROM_ADDRESS:no-reply@ielts.local}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  health:
    # Mail server không bắt buộc để hệ thống chạy; gửi email lỗi chỉ ghi log.
    mail:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me-0123456789}
    access-ttl: ${JWT_ACCESS_TTL:30m}
    refresh-ttl: ${JWT_REFRESH_TTL:7d}
    refresh-reuse-grace: ${JWT_REFRESH_REUSE_GRACE:30s}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:Admin@123}
    full-name: ${ADMIN_FULL_NAME:Quản trị viên}
    email: ${ADMIN_EMAIL:admin@ielts.local}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  mail:
    from: ${MAIL_FROM:IELTS Writing <no-reply@ielts.local>}
    login-url: ${APP_LOGIN_URL:http://localhost:3000/dang-nhap}
    app-url: ${APP_URL:http://localhost:3000}
  upload-dir: ${UPLOAD_DIR:./uploads}
  zone: ${APP_ZONE:Asia/Ho_Chi_Minh}
  reminders:
    enabled: ${APP_REMINDERS_ENABLED:true}
    interval: PT15M
    soon: PT24H
    urgent: PT2H
  # Server TCP import sinh viên (docs/05 phần C), chạy cùng ứng dụng.
  tcp:
    enabled: ${APP_TCP_ENABLED:true}
    port: ${APP_TCP_PORT:9090}
    threads: 16
    read-timeout: 30s
    session-timeout: 5m
    max-payload: 5242880
  # Một tài khoản một phiên (FR-06): đăng nhập nơi mới thì phiên cũ bị thu hồi và nhận FORCE_LOGOUT qua WebSocket.
  session:
    single-login: ${APP_SINGLE_LOGIN:true}
  # Giới hạn tần suất trong bộ nhớ (NFR-09).
  rate-limit:
    login-max-failures: 5
    login-window: 5m
    remind-max: 3
    remind-window: 10m
  # Chế độ thi (Mức 3, bước 15): job báo quá giờ, giới hạn thông báo chuyển tab / dán.
  exam:
    overtime-check: PT15S
    alert-window: PT2M
    max-events-per-minute: 30
  # Xem trực tiếp bài đang gõ (B15b): client gửi tối đa ~1 lần / giây khi đang gõ.
  live:
    max-updates-per-minute: 120
  # Tài liệu paper cùng sửa (Mức 4, B22): Yjs update đi qua STOMP (khung tối đa 64 KB, base64 +33%).
  paper:
    max-update-bytes: 32768
    max-snapshot-bytes: 4194304
    max-text-chars: 200000
    max-updates-per-minute: 600
    # Thư viện trích dẫn (B24): tra DOI qua backend (tránh CORS, có giới hạn tần suất).
    max-references: 300
    max-csl-bytes: 16384
    doi-base-url: https://doi.org
    doi-timeout: 10s
    doi-lookups-per-minute: 20
  grading:
    max-error-codes-per-teacher: 100
    max-comment-bank-items-per-teacher: 500
  ai:
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
  # Dữ liệu mẫu — chỉ được nạp khi bật profile demo (SPRING_PROFILES_ACTIVE=docker,demo). Xem README.
  demo:
    prefix: ${DEMO_PREFIX:DEMO}
    password: ${DEMO_PASSWORD:Demo@2026}
    students-per-class: 10
    # Lớp kiểm thử tải (bước 14, loadtest/): 500 sinh viên cho 500 kết nối WebSocket.
    load-students: ${DEMO_LOAD_STUDENTS:0}
