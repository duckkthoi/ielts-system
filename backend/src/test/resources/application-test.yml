# Profile cho test tự động: dùng database riêng ielts_test, không đụng dữ liệu dev.
spring:
  datasource:
    url: jdbc:postgresql://${TEST_DB_HOST:localhost}:${TEST_DB_PORT:5432}/${TEST_DB_NAME:ielts_test}
    username: ${TEST_DB_USER:ielts}
    password: ${TEST_DB_PASSWORD:ielts}

app:
  admin:
    username: admin
    password: Admin@123
  upload-dir: ${java.io.tmpdir}/ielts-test-uploads
  # Test tự gọi job với đồng hồ giả, không để bộ lập lịch chạy nền.
  reminders:
    enabled: false
  # Test lấy token nhiều lần cho cùng một người; chính sách một phiên chỉ bật trong test riêng của nó.
  session:
    single-login: false
  # Cổng ngẫu nhiên; ít luồng và timeout ngắn để test được "pool đầy" và "quá thời gian chờ".
  # Tra DOI trỏ về máy chủ giả do PaperReferenceIntegrationTest bật (không gọi ra internet khi test).
  paper:
    doi-base-url: http://127.0.0.1:18089
    doi-timeout: 2s
  tcp:
    port: 0
    threads: 3
    read-timeout: 2s

logging:
  level:
    com.ltmtu.ielts: INFO
    org.flywaydb: WARN
