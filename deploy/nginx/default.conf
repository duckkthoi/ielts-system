# nginx — cổng vào duy nhất của hệ thống (docs/01 mục kiến trúc triển khai, NFR-08).
# HTTP → chuyển hết sang HTTPS; HTTPS: "/" → frontend, "/api", "/uploads", "/ws" → backend.
# Chứng chỉ tự ký tạo bằng deploy/nginx/gen-cert.sh, mount vào /etc/nginx/certs.
# Server TCP import (cổng 9090) KHÔNG đi qua nginx: docker compose mở thẳng cổng của backend (docs/05 phần C).

# WebSocket: header Connection phụ thuộc client có xin nâng cấp hay không.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream backend {
    server backend:8080;
    keepalive 32;
}

upstream frontend {
    server frontend:3000;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # Ảnh đề tối đa 5 MB, file import vài MB.
    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://backend;
        include /etc/nginx/snippets/proxy_headers.conf;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    location /uploads/ {
        proxy_pass http://backend;
        include /etc/nginx/snippets/proxy_headers.conf;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # WebSocket STOMP (wss://<máy chủ>/ws). Giữ kết nối lâu; heartbeat STOMP giữ cho kết nối không bị coi là rảnh.
    location /ws {
        proxy_pass http://backend;
        include /etc/nginx/snippets/proxy_headers.conf;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Header bảo mật cho trang web (frontend). API / WebSocket đã có header của Spring Security, thêm ở đây sẽ bị lặp.
    location / {
        proxy_pass http://frontend;
        include /etc/nginx/snippets/proxy_headers.conf;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
