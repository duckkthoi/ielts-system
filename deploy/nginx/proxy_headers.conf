# Header gửi kèm mọi request chuyển tiếp (include trong TỪNG location: proxy_set_header khai báo ở mức server
# không được kế thừa vào location nào đã tự khai báo proxy_set_header riêng).
# Backend bật server.forward-headers-strategy=framework (profile docker) để request.getRemoteAddr() là IP thật —
# dùng cho nhật ký và giới hạn đăng nhập sai.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;
