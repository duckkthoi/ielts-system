# Toàn bộ hệ thống trong Docker (bước 13). Chạy: copy .env.example thành .env, tạo chứng chỉ
# (sh deploy/nginx/gen-cert.sh), rồi: docker compose up --build  →  https://localhost
#
# Cổng mở ra máy chủ: 80/443 (nginx, cổng vào duy nhất cho web), 9090 (server TCP cho admin-cli),
# 8025 (giao diện Mailpit xem email). Backend 8080 và PostgreSQL KHÔNG mở ra ngoài: chỉ đi qua nginx / mạng nội bộ,
# nên header X-Forwarded-For chỉ nginx đặt được (backend tin header này để lấy IP thật).
name: ielts

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ielts
      POSTGRES_USER: ielts
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Đặt DB_PASSWORD trong .env}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ielts -d ielts"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      # docker,demo = nạp thêm dữ liệu mẫu (README mục "Dữ liệu mẫu"); mặc định chỉ docker.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-Demo@2026}
      DEMO_LOAD_STUDENTS: ${DEMO_LOAD_STUDENTS:-0}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Đặt JWT_SECRET trong .env (ít nhất 32 ký tự)}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Đặt ADMIN_PASSWORD trong .env}
      APP_URL: ${PUBLIC_URL:-https://localhost}
      APP_LOGIN_URL: ${PUBLIC_URL:-https://localhost}/dang-nhap
      CORS_ALLOWED_ORIGINS: ${PUBLIC_URL:-https://localhost}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - uploads:/data/uploads
    ports:
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      # Ảnh JRE không có curl/wget: dùng bash /dev/tcp gọi /actuator/health.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /actuator/health HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q UP <&3'"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ""
        NEXT_PUBLIC_WS_URL: ${PUBLIC_WS_URL:-wss://localhost/ws}
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/proxy_headers.conf:/etc/nginx/snippets/proxy_headers.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
